mode: deployment

image:
  repository: otel/opentelemetry-collector-k8s

fullnameOverride: otel-collector

config:
  exporters:
    otlp_grpc/jaeger:
      endpoint: jaeger.observability:4317
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        exporters:
          - otlp_grpc/jaeger
          - debug
        processors:
          - memory_limiter
          - batch
        receivers:
          - otlp
